
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Blackout Ops: Section 5</title>
  <style>
    body {
      background-color: #0d0d0d;
      color: #00ffcc;
      font-family: 'Courier New', Courier, monospace;
      padding: 2rem;
    }
    .section {
      margin-top: 2rem;
    }
    input, button {
      background-color: #000;
      color: #00ffcc;
      border: 1px solid #00ffcc;
      padding: 0.5rem;
      font-size: 1rem;
    }
    img {
      max-width: 100%;
      margin-top: 1rem;
      border: 1px solid #00ffcc;
    }
  </style>
</head>
<body onload="document.getElementById('voice').play()">

  <h1>BLACKOUT OPS</h1>
  <div class="section">
    <h2>Section 5: Extraction Point</h2>
    <p>
      The tunnel opens to the surface — a wind-battered helipad glows dimly in the night. A static-laced radio hums beside the panel.
    </p>
    <p><em>A distorted voice crackles through the static...</em></p>

    <audio id="voice" src="voiceover.speechify.com_editor_nJpi4TRHu1SMSyVhbXAcif_returnTo=https3A2F2Fstudio.speechify.com2Fonboarding2Fplans - Google Chrome - 2 May 2025.mp3"></audio>

    <img src="A_digital_painting_depicts_a_dimly_lit_extraction_.png" alt="Extraction Point">

    <p><strong>Enter the 3-letter evac code:</strong></p>
    <input type="text" id="codeInput" placeholder="e.g., ZEB">
    <button onclick="checkCode()">Submit</button>
    <p id="result"></p>
  </div>

  <script>
    function checkCode() {
      const input = document.getElementById('codeInput').value.trim().toUpperCase();
      const result = document.getElementById('result');
      if (input === "ZEB") {
        result.textContent = "Confirmed. Extraction en route.";
        result.style.color = "#00ffcc";
      } else {
        result.textContent = "Code rejected. Signal not confirmed.";
        result.style.color = "red";
      }
    }
  </script>

</body>
</html>
