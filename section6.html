
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Blackout Ops: Section 6</title>
  <style>
    body {
      background-color: #0d0d0d;
      color: #00ffcc;
      font-family: 'Courier New', Courier, monospace;
      padding: 2rem;
    }
    .section {
      margin-top: 2rem;
    }
    input, button {
      background-color: #000;
      color: #00ffcc;
      border: 1px solid #00ffcc;
      padding: 0.5rem;
      font-size: 1rem;
    }
    img {
      max-width: 100%;
      margin-top: 1rem;
      border: 1px solid #00ffcc;
    }
  </style>
</head>
<body>

  <h1>BLACKOUT OPS</h1>
  <div class="section">
    <h2>Section 6: Debrief & Override</h2>
    <p>
      The ops board flickers. Emergency override required.<br>
      Input the 3-letter authorization sequence based on the call sign logic:
    </p>
    <ul>
      <li>Zulu is never second.</li>
      <li>Echo is not first, and never follows Zulu.</li>
      <li>Bravo comes before Echo.</li>
    </ul>
    <img src="A_digital_3D-rendered_image_depicts_a_tactical_ope.png" alt="Tactical Ops Board" />
    <br><br>
    <label for="codeInput">Enter authorization code:</label><br>
    <input type="text" id="codeInput" placeholder="e.g., BEZ" />
    <button onclick="checkCode()">Submit</button>
    <p id="result"></p>
  </div>

  <script>
    function checkCode() {
      const input = document.getElementById('codeInput').value.trim().toUpperCase();
      const result = document.getElementById('result');
      if (input === "BEZ") {
        result.textContent = "Authorization accepted. Extraction route unlocked.";
        result.style.color = "#00ffcc";
      } else {
        result.textContent = "Sequence mismatch. Board lockout in 30 seconds...";
        result.style.color = "red";
      }
    }
  </script>

</body>
</html>
